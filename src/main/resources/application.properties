spring.application.name=demo-agent
spring.datasource.url=jdbc:sqlite:${DEMO_AGENT_DB:demo-agent.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.sql.init.mode=always
spring.datasource.hikari.maximum-pool-size=5

# Downstream Stage 1 API. Override this when the order APIs run as a separate service.
support.order-api.base-url=${ORDER_API_BASE_URL:http://localhost:${server.port:8080}}
support.order-api.connect-timeout=2s
support.order-api.read-timeout=4s
support.chat-api.base-url=${CHAT_API_BASE_URL:http://localhost:${server.port:8080}}
support.chat-api.connect-timeout=2s
support.chat-api.read-timeout=30s

# Groq exposes an OpenAI-compatible endpoint, so the official OpenAI Java SDK is used.
support.llm.api-key=${GROQ_API_KEY:}
support.llm.base-url=${GROQ_BASE_URL:https://api.groq.com/openai/v1}
support.llm.model=${GROQ_MODEL:openai/gpt-oss-20b}
support.llm.timeout=25s
support.llm.max-retries=1
support.agent.max-iterations=5
support.agent.max-tool-calls=8
support.agent.max-validation-retries=2
support.agent.history-turns=6

# Delivery Agent has its own bounded LLM/tool loop and reuses the configured model connection.
delivery.agent.max-iterations=4
delivery.agent.max-tool-calls=2
delivery.agent.max-validation-retries=2

# Optional asynchronous grading of completed live chat traffic. Disabled by default so normal
# development does not incur evaluator-model cost. A sample rate of 1.0 grades every response.
support.runtime-eval.enabled=${RUNTIME_EVAL_ENABLED:false}
support.runtime-eval.sample-rate=${RUNTIME_EVAL_SAMPLE_RATE:1.0}
support.runtime-eval.max-iterations=4
support.runtime-eval.max-results=200
support.runtime-eval.workers=2
support.runtime-eval.queue-capacity=100
support.runtime-eval.report-directory=${RUNTIME_EVAL_REPORT_DIR:target/runtime-eval}

# The UI uses precompiled Vaadin web components; no Node build is needed for development.
vaadin.launch-browser=false

logging.pattern.level=%5p [traceId=%X{supportTraceId:-} spanId=%X{supportSpanId:-} sessionId=%X{sessionId:-}]
